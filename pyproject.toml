[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"src/digest.py" = ["E501"]  # inline-styled email HTML template requires long lines
"src/intel/report.py" = ["E501"]  # HTML report template requires long lines

[tool.pytest.ini_options]
testpaths = ["tests"]
