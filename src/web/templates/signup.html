{% extends "base.html" %}
{% block bodyclass %}public{% endblock %}
{% block shell %}
<div class="auth">
  <div class="brand">Fed<span>intel</span></div>
  <h1>Create your account</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup">
    <label>Work email</label><input name="email" type="email" required class="w100">
    <label>Password (10+ characters)</label><input name="password" type="password" required minlength="10" class="w100">
    <label>Organization name</label><input name="org_name" type="text" required class="w100">
    {% if gated %}
    <label>Early-access invite code</label><input name="access_code" type="text" required class="w100">
    {% endif %}
    <div class="mt16"><button type="submit" class="w100">Sign up</button></div>
  </form>
  <p class="conf" class="mt12">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
