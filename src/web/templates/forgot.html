{% extends "base.html" %}
{% block bodyclass %}public{% endblock %}
{% block shell %}
<div class="auth">
  <div class="brand">Fed<span>intel</span></div>
  <h1>Reset your password</h1>
  {% if sent %}
  <div class="okmsg">If that email has an account, a reset link is on its way.</div>
  {% else %}
  <form method="post" action="/forgot">
    <label>Email</label><input name="email" type="email" required class="w100">
    <div class="mt14"><button type="submit" class="w100">Send reset link</button></div>
  </form>
  {% endif %}
  <p class="conf mt14"><a href="/login">Back to log in</a></p>
</div>
{% endblock %}
